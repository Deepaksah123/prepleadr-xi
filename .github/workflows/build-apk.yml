name: Build APK
on:
  push:
    paths:
      - 'MARROW_UI_FINAL.html'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy UI into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp MARROW_UI_FINAL.html app/src/main/assets/MARROW_UI_FINAL.html
      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v             -keystore release-key.jks             -storepass prepleadrx-build             -keypass prepleadrx-build             -alias prepleadrx             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=PrepLeadr X, OU=Build, O=PrepLeadr X, L=NA, ST=NA, C=IN"
      - name: Build signed release APK
        run: |
          gradle assembleRelease --no-daemon             -PRELEASE_STORE_FILE="$GITHUB_WORKSPACE/release-key.jks"             -PRELEASE_STORE_PASSWORD="prepleadrx-build"             -PRELEASE_KEY_ALIAS="prepleadrx"             -PRELEASE_KEY_PASSWORD="prepleadrx-build"
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk >/dev/null
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PrepLeadr-X-installable-apk
          path: app/build/outputs/apk/release/app-release.apk
